name: TestFlight

# Version comes from the latest vX.Y.Z tag (1.0.0 if none); the build number is the run number.
# Push a tag to ship that version, or run manually with a bump to tag the next version.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths-ignore: ['**.md']
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options: [none, patch, minor, major]
        default: none

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        env:
          BUMP: ${{ inputs.bump || 'none' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            latest=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
            version="${latest#v}"
            version="${version:-1.0.0}"
            IFS=. read -r major minor patch <<< "$version"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            if [ "$BUMP" != none ]; then
              echo "NEW_TAG=v$version" >> "$GITHUB_ENV"
            fi
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "### seMou $version (${{ github.run_number }})" >> "$GITHUB_STEP_SUMMARY"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error::Set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 repository secrets (see README)."
            exit 1
          fi
          echo "ARCHIVE=$RUNNER_TEMP/seMou.xcarchive" >> "$GITHUB_ENV"
          echo "KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      # Signing is cloud-managed: xcodebuild uses the API key to fetch the distribution
      # certificate and provisioning profile, so no certificates are stored in the repo.
      - name: Archive
        run: |
          xcodebuild -project seMou.xcodeproj -scheme seMou -configuration Release \
            -destination 'generic/platform=macOS' -archivePath "$ARCHIVE" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Upload to TestFlight
        run: |
          xcodebuild -exportArchive -archivePath "$ARCHIVE" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Tag new version
        if: env.NEW_TAG != ''
        run: |
          git tag "$NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Remove API key
        if: always()
        run: rm -f "$KEY_PATH"
